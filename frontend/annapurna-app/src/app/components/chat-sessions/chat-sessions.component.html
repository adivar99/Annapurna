<div class="chat-sessions-container">
  <h2>Your Chat Sessions</h2>
  
  <div *ngIf="isLoading" class="loading">
    <mat-spinner diameter="40"></mat-spinner>
  </div>

  <div *ngIf="error" class="error-message">
    {{ error }}
  </div>

  <div *ngIf="!isLoading && sessions.length === 0" class="no-sessions">
    <p>You don't have any active chat sessions.</p>
    <p>Start a new conversation by viewing a recipe!</p>
  </div>

  <div class="sessions-list">
    <mat-card *ngFor="let session of sessions" class="session-card" (click)="openSession(session)">
      <mat-card-content>
        <div class="session-header">
          <h3>{{ session.recipe_title }}</h3>
          <button mat-icon-button (click)="deleteSession(session, $event)" class="delete-btn">
            <mat-icon>delete</mat-icon>
          </button>
        </div>
        <p class="last-message" *ngIf="session.last_message">
          {{ session.last_message }}
        </p>
        <p class="timestamp">
          Last updated: {{ formatDate(session.updated_at) }}
        </p>
      </mat-card-content>
    </mat-card>
  </div>
</div>
