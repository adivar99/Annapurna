<button class="back-btn" (click)="goBack()">
  <mat-icon>arrow_back</mat-icon> Back
</button>
<div class="chat-page-wrapper">
  <div class="recipe-panel">
    <div class="recipe-card">
      <h2 class="recipe-title">{{ recipe.title }}</h2>
      <img class="recipe-image" [src]="recipe.imageUrl" alt="{{ recipe.title }}" />
      <div class="section-label">Ingredients</div>
      <ul class="ingredients-list">
        <li *ngFor="let ingredient of recipe.ingredients">
          <mat-icon>radio_button_checked</mat-icon>
          <span>{{ ingredient.quantity }} {{ ingredient.unit }} {{ ingredient.name }}</span>
        </li>
      </ul>
      <div class="section-label">Instructions</div>
      <ol class="instructions-list">
        <li *ngFor="let step of recipe.instructions; let i = index">
          <span class="step-number">{{ i + 1 }}</span>
          <span>{{ step }}</span>
        </li>
      </ol>
    </div>
  </div>
  <div class="chat-panel">
    <div class="chat-header">
      <!-- <span class="logo">logo</span> -->
      <div class="assistant-info">
        <div class="assistant-title">Recipe Assistant</div>
        <div class="assistant-status">Online • Responds in seconds</div>
      </div>
    </div>
    <div class="chat-messages">
      <div *ngFor="let message of messages" class="message" [ngClass]="message.sender">
        <div [innerText]="message.text"></div>
      </div>
    </div>
    <form (submit)="sendMessage()" class="chat-input-area">
      <input
        [(ngModel)]="userInput"
        name="input"
        placeholder="Type your message here..."
        required
        autocomplete="off"
      />
      <button type="submit" [disabled]="isChatLoading">
        <mat-icon *ngIf="!isChatLoading">send</mat-icon>
        <mat-icon *ngIf="isChatLoading" class="loading">autorenew</mat-icon>
      </button>
    </form>
  </div>
</div>
