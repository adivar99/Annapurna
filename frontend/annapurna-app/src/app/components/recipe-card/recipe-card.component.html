<mat-card class="recipe-card" (click)="redirectChat()">
    <mat-card-header>
      <mat-card-title>{{ recipe.title }}</mat-card-title>
      <button mat-icon-button class="favorite-button" (click)="toggleFavorite(recipe)">
        <mat-icon [color]="recipe.isFavorite ? 'warn' : ''">{{recipe.isFavorite? 'favorite':'favorite_border'}}</mat-icon>
      </button>
    </mat-card-header>
    <mat-card-content>
      <p>{{ recipe.description }}</p>
      <mat-chip-set>
        <mat-chip *ngFor="let tag of recipe.tags">{{ tag }}</mat-chip>
      </mat-chip-set>
    </mat-card-content>
  </mat-card>
