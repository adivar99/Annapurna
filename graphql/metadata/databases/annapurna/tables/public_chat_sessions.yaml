table:
  name: chat_sessions
  schema: public
object_relationships:
  - name: recipe
    using:
      foreign_key_constraint_on: recipe_id
  - name: user
    using:
      foreign_key_constraint_on: user_id
array_relationships:
  - name: messages
    using:
      foreign_key_constraint_on:
        column: session_id
        table:
          name: chat_messages
          schema: public
insert_permissions:
  - role: user
    permission:
      check: {}
      set:
        user_id: x-hasura-User-Id
      columns:
        - recipe_id
        - expires_at
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - user_id
        - recipe_id
        - created_at
        - updated_at
        - expires_at
      filter:
        user_id:
          _eq: X-Hasura-User-Id
delete_permissions:
  - role: user
    permission:
      filter:
        user_id:
          _eq: X-Hasura-User-Id
