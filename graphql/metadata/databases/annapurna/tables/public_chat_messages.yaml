table:
  name: chat_messages
  schema: public
object_relationships:
  - name: session
    using:
      foreign_key_constraint_on: session_id
insert_permissions:
  - role: user
    permission:
      check:
        session:
          user_id:
            _eq: X-Hasura-User-Id
      columns:
        - session_id
        - sender
        - text
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - session_id
        - sender
        - text
        - created_at
      filter:
        session:
          user_id:
            _eq: X-Hasura-User-Id
