table:
  name: users
  schema: public
array_relationships:
  - name: chat_sessions
    using:
      foreign_key_constraint_on:
        column: user_id
        table:
          name: chat_sessions
          schema: public
  - name: recipes
    using:
      foreign_key_constraint_on:
        column: author_id
        table:
          name: recipes
          schema: public
  - name: saved_recipes
    using:
      foreign_key_constraint_on:
        column: user_id
        table:
          name: saved_recipes
          schema: public
select_permissions:
  - role: public
    permission:
      columns:
        - id
        - name
        - username
        - image_url
      filter: {}
  - role: user
    permission:
      columns:
        - id
        - name
        - email
        - username
        - image_url
        - created_at
        - updated_at
      filter:
        id:
          _eq: X-Hasura-User-Id
update_permissions:
  - role: user
    permission:
      columns:
        - name
        - username
        - image_url
      filter:
        id:
          _eq: X-Hasura-User-Id
      check: null
