services:
  backend:
    image: annapurna/backend
    build: backend
    volumes:
      - ./backend/app:/app
    ports:
      - 8080:8080
    env_file:
      - .env
  frontend:
    image: annapurna/frontend
    env_file:
      - .env
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:4200"
    volumes:
      - ./frontend/annapurna-app:/src/annapurna-app
      - /src/annapurna-app/node_modules
  proxy:
    image: annapurna/proxy:latest
    depends_on:
     - frontend
     - backend
    ports:
      - "80:80"

networks:
  annapurna_default:
    external: true
