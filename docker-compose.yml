services:
  frontend:
    image: annapurna/frontend
    env_file:
      - .env
    build:
      context: ./frontend-nextjs
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend-nextjs/annapurna-app:/src/annapurna-app
      - /src/annapurna-app/node_modules
