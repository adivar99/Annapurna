<div class="home-page-wrapper">
    <div class="main-content">
      <div class="recipes-panel">
        <h2>Your Favourites</h2>
  
        <div *ngIf="isLoading" class="loading-container">
          <mat-spinner></mat-spinner>
        </div>
  
        <div *ngIf="error" class="error-container">
          <p>{{ error }}</p>
          <button mat-raised-button color="primary" (click)="loadRecipes()">Try Again</button>
        </div>
  
        <div *ngIf="!isLoading && !error" class="recipes-grid">
          <app-recipe-card
            class="recipe-card"
            *ngFor="let recipe of recipes"
            [recipe]="recipe"
          ></app-recipe-card>
  
          <mat-card *ngIf="recipes.length === 0" class="no-recipes">
            <mat-card-content>
              <mat-icon>restaurant</mat-icon>
              <p>No recipes found. Like some recipes and come back.</p>
            </mat-card-content>
          </mat-card>
        </div>
      </div>
    </div>
  </div>
